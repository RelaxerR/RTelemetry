services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rtelemetry
      POSTGRES_USER: rtelemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtelemetry -d rtelemetry"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  server:
    build: .
    ports:
      - "127.0.0.1:${RTELEMETRY_HOST_PORT:-5180}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - RTelemetry__Storage__Provider=Postgres
      - RTelemetry__Storage__ConnectionString=Host=postgres;Database=rtelemetry;Username=rtelemetry;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - RTelemetry__Projects__${RTELEMETRY_PROJECT:-app}__ApiKey=${RTELEMETRY_PROJECT_KEY:?Set RTELEMETRY_PROJECT_KEY}
      - RTelemetry__Projects__${RTELEMETRY_PROJECT:-app}__RequireInstallAuthorization=${RTELEMETRY_REQUIRE_INSTALL_AUTHORIZATION:-false}
      - RTelemetry__Projects__${RTELEMETRY_PROJECT:-app}__InstallAuthorizationUrl=${RTELEMETRY_INSTALL_AUTHORIZATION_URL:-}
      - RTelemetry__Projects__${RTELEMETRY_PROJECT:-app}__InstallAuthorizationKey=${RTELEMETRY_INSTALL_AUTHORIZATION_KEY:-}
      - RTelemetry__AdminKey=${RTELEMETRY_ADMIN_KEY:?Set RTELEMETRY_ADMIN_KEY}
      - RTelemetry__Dashboard__User=admin
      - RTelemetry__Dashboard__Password=${RTELEMETRY_DASHBOARD_PASSWORD:?Set RTELEMETRY_DASHBOARD_PASSWORD}
      - RTelemetry__RetentionDays=90
      - RTelemetry__TrustedProxies__0=${RTELEMETRY_TRUSTED_PROXY:-127.0.0.1}
      - Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command=None
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
