services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rtelemetry
      POSTGRES_USER: rtelemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rtelemetry -d rtelemetry"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  server:
    build: .
    ports:
      - "127.0.0.1:5180:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      RTelemetry__Storage__Provider: Postgres
      RTelemetry__Storage__ConnectionString: "Host=postgres;Database=rtelemetry;Username=rtelemetry;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      RTelemetry__Projects__app__ApiKey: ${RTELEMETRY_PROJECT_KEY:?Set RTELEMETRY_PROJECT_KEY}
      RTelemetry__AdminKey: ${RTELEMETRY_ADMIN_KEY:?Set RTELEMETRY_ADMIN_KEY}
      RTelemetry__Dashboard__User: admin
      RTelemetry__Dashboard__Password: ${RTELEMETRY_DASHBOARD_PASSWORD:?Set RTELEMETRY_DASHBOARD_PASSWORD}
      RTelemetry__RetentionDays: 90
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
